<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Draaimolen 2026</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Draaimolen">

<style>
:root{
  --bg:#1f3631; --bg-deep:#182b27; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --fg:#eeeeee; --fg2:#b9c6c1; --fg3:#7f918b;
  --pill-dark:rgba(18,32,29,.72); --pill-light:rgba(190,200,195,.28); --pill-border:rgba(255,255,255,.14);
  --chip:rgba(120,145,138,.45);
  --pick:#e9a75c; --pick-fg:#1a2b27; --pick-glow:rgba(233,167,92,.45);
  --now:#ff6a5c;
  --tcol:46px; --col:150px; --q:17px; --head:44px;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
  --glow:0 0 8px rgba(255,255,255,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;
  background:
    radial-gradient(60% 40% at 78% 22%, rgba(150,80,60,.55), transparent 70%),
    radial-gradient(45% 35% at 62% 38%, rgba(170,150,70,.45), transparent 70%),
    radial-gradient(50% 45% at 88% 60%, rgba(110,120,60,.35), transparent 70%),
    radial-gradient(40% 30% at 30% 85%, rgba(90,130,110,.35), transparent 70%),
    linear-gradient(180deg,#24403a 0%,#1f3631 45%,#182b27 100%);
  background-attachment:fixed}

/* ---------- top bar ---------- */
header{flex:none;padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 0 calc(var(--sal) + 14px);
  background:rgba(95,113,110,.35);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.title h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.02em;text-shadow:var(--glow)}
.title h1 span{color:var(--fg)}
.count{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
.count b{color:var(--pick);font-weight:700}
nav{display:flex;align-items:center;gap:8px;margin:10px 0 8px}
.views{display:flex;gap:4px;background:rgba(18,32,29,.55);padding:3px;border-radius:9px;margin:0 0 10px}
.view{flex:1;border:0;background:transparent;color:var(--fg2);font:inherit;font-size:12.5px;font-weight:700;padding:8px 4px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;gap:5px;letter-spacing:.02em}
.view .dot{width:7px;height:7px;border-radius:50%;background:var(--pick)}
.view .vc{font-variant-numeric:tabular-nums;color:var(--pick)}
.view .vc:empty{display:none}
.view.on{background:rgba(238,238,238,.92);color:#1a2b27}
.view.on .vc{color:#8a5a1c}
.tabs{display:flex;gap:6px;flex:1}
.tab{flex:1;border:1px solid var(--pill-border);background:var(--pill-dark);color:var(--fg);font:inherit;font-size:14px;font-weight:700;
  padding:9px 6px;border-radius:8px;line-height:1.1;letter-spacing:.02em;text-shadow:var(--glow)}
.tab small{display:block;font-size:10.5px;font-weight:500;color:var(--fg2);margin-top:2px;letter-spacing:.04em;text-shadow:none}
.tab.on{background:rgba(238,238,238,.92);color:#1a2b27;text-shadow:none;border-color:transparent}
.tab.on small{color:#4d5f5a}
.tab.today small::after{content:" · today";color:var(--now)}
.tab.on.today small::after{color:#c2402f}

/* ---------- grid ---------- */
#grid{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch;
  scroll-padding-left:var(--tcol);scroll-snap-type:x proximity}
.sheet{position:relative;display:grid;grid-template-columns:var(--tcol) repeat(6,var(--col));
  grid-template-rows:var(--head) calc(51 * var(--q));
  width:max-content;padding-right:calc(var(--sar) + 16px);padding-bottom:calc(var(--sab) + 24px)}
.corner{position:sticky;top:0;left:0;z-index:5;background:#213833;
  border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.stage{position:sticky;top:0;z-index:3;background:#213833;
  border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 10px;font-size:12.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;text-shadow:var(--glow);scroll-snap-align:start}
.stage i{display:none}
.times{position:sticky;left:0;z-index:4;background:#213833;border-right:1px solid var(--line)}
.t{position:absolute;right:5px;font-size:10px;font-weight:600;color:var(--fg);background:var(--chip);padding:2px 4px;border-radius:3px;
  font-variant-numeric:tabular-nums;transform:translateY(-50%);line-height:1}
.col{position:relative;border-right:1px solid var(--line2);
  background:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent calc(4 * var(--q)))}
.act{position:absolute;left:3px;right:3px;border-radius:7px;background:var(--pill-dark);color:var(--fg);
  border:1px solid var(--pill-border);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:6px 8px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;
  cursor:pointer;transition:transform .08s}
.col .act:nth-child(even){background:var(--pill-light)}
.act:active{transform:scale(.97)}
.act .n{font-size:12.5px;font-weight:800;line-height:1.2;letter-spacing:.02em;text-transform:uppercase;text-shadow:var(--glow);
  display:-webkit-box;-webkit-line-clamp:var(--lines,3);-webkit-box-orient:vertical;overflow:hidden}
.act .tm{font-size:10.5px;color:var(--fg2);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.act.on,.col .act.on:nth-child(even){background:var(--pick);color:var(--pick-fg);border-color:transparent;box-shadow:0 0 18px var(--pick-glow)}
.act.on .n{text-shadow:none}
.act.on .tm{color:#4a3a22}
.act.on::after{content:"✓";position:absolute;right:7px;top:5px;font-size:12px;font-weight:800}
.act.on .n{padding-right:12px}
.act.h1{--lines:1}.act.h2{--lines:2}
.act.h1 .tm,.act.h2 .tm{display:none}
.act.h3{--lines:2}
.act.h1{justify-content:center;padding-top:0;padding-bottom:0}
body.picks .act:not(.on){opacity:.22;filter:saturate(0)}
/* ---------- map view ---------- */
#map{flex:1;overflow:auto;display:none;padding:10px calc(var(--sar) + 14px) calc(var(--sab) + 30px) calc(var(--sal) + 14px)}
.mapwrap{position:relative;width:100%;aspect-ratio:1080/1350;border-radius:10px;overflow:hidden;background:#1b302c;border:1px solid var(--pill-border)}
.mapwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mk{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:rgba(238,238,238,.95);color:#1a2b27;
  font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #1a2b27;z-index:2;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.mk.pick{background:var(--pick);box-shadow:0 0 0 3px rgba(233,167,92,.35),0 0 14px var(--pick-glow)}
.mk.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,106,92,.8);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.5);opacity:0}}
.lb{position:absolute;z-index:2;max-width:30%;background:rgba(18,32,29,.86);border:1px solid var(--pill-border);border-radius:6px;padding:3px 6px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);line-height:1.15}
.lb .st{display:block;font-size:7.5px;font-weight:700;letter-spacing:.1em;color:var(--fg2);text-transform:uppercase}
.lb .ar{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:var(--glow)}
.lb .ar small{font-weight:600;color:var(--fg2);text-shadow:none}
.lb.pick{background:var(--pick);border-color:transparent}
.lb.pick .ar,.lb.pick .st{color:var(--pick-fg);text-shadow:none}
.lb.dim .ar{color:var(--fg2)}
.scrub{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.scrub b{font-variant-numeric:tabular-nums;font-size:15px;min-width:48px;text-shadow:var(--glow)}
.scrub input{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:0}
.scrub input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--fg);border:0;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.scrub button{border:1px solid var(--pill-border);background:var(--pill-dark);color:var(--fg);font:inherit;font-size:12px;font-weight:700;padding:7px 10px;border-radius:7px}
.scrub button.live{background:var(--now);border-color:transparent;color:#fff}
.scrubhint{font-size:11px;color:var(--fg3);text-align:center;margin-bottom:10px}
.mrow{display:flex;gap:10px;align-items:center;padding:9px 10px;margin-bottom:6px;border-radius:8px;background:var(--pill-dark);border:1px solid var(--pill-border)}
.mrow .num{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(238,238,238,.92);color:#1a2b27;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.mrow.pick .num{background:var(--pick)}
.mrow .body{flex:1;min-width:0}
.mrow .st{font-size:9.5px;letter-spacing:.1em;color:var(--fg2);text-transform:uppercase;font-weight:700}
.mrow .ar{font-size:13px;font-weight:800;text-transform:uppercase;text-shadow:var(--glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nx{font-size:11px;color:var(--fg2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nx b{color:var(--fg);font-weight:600}
.mrow.pick .ar{color:var(--pick)}
.strip .nn{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;letter-spacing:.01em}
.strip .nn i:first-child{display:inline-block;min-width:34px}
.strip .nn em{font-style:normal;font-weight:800;color:var(--fg);letter-spacing:.06em;margin-right:3px}
.strip .nn + .nn{margin-top:3px}
.strip .nn i{font-style:normal;color:var(--fg2);font-weight:600;margin-right:4px}
.strip.nownext{text-align:left;font-size:12.5px}
.nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--now);z-index:2;pointer-events:none;display:none}
.nowline::before{content:"";position:absolute;left:var(--tcol);top:-5px;width:8px;height:8px;border-radius:50%;background:var(--now);margin-left:-4px}
.nowlbl{position:absolute;left:0;right:0;display:none;background:var(--now);color:#fff;font-size:10.5px;font-weight:800;text-align:center;
  padding:3px 0;transform:translateY(-50%);font-variant-numeric:tabular-nums;z-index:2}

/* ---------- picks list ---------- */
#list{flex:1;overflow:auto;display:none;padding:12px calc(var(--sar) + 14px) calc(var(--sab) + 30px) calc(var(--sal) + 14px)}
body.picks #grid,body.map #grid{display:none} body.picks #list{display:block} body.map #map{display:block}
.empty{color:var(--fg2);text-align:center;padding:60px 20px;font-size:15px;line-height:1.5}
.empty b{color:var(--fg)}
.row{display:flex;gap:12px;align-items:stretch;padding:10px 12px;margin-bottom:8px;border-radius:8px;background:var(--pill-dark);
  border:1px solid var(--pill-border);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.row .when{flex:none;width:52px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:800;line-height:1.35}
.row .when small{display:block;color:var(--fg2);font-weight:500;font-size:11.5px}
.row .what{flex:1;min-width:0}
.row .what .n{font-weight:800;font-size:14px;line-height:1.25;text-transform:uppercase;text-shadow:var(--glow);letter-spacing:.02em}
.row .what .s{font-size:11px;color:var(--fg2);margin-top:4px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.row .what .s i{display:none}
.clash{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--now);border:1px solid var(--now);
  border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;text-transform:uppercase}
.row .x{flex:none;align-self:center;border:1px solid var(--pill-border);background:rgba(255,255,255,.08);color:var(--fg);width:32px;height:32px;border-radius:50%;font-size:16px;line-height:30px;text-align:center;padding:0}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;border:1px solid var(--pill-border);background:var(--pill-dark);color:var(--fg);font:inherit;font-size:13.5px;font-weight:700;padding:12px;border-radius:8px;text-shadow:var(--glow)}
.btn.warn{color:var(--now);text-shadow:none}
.hint{color:var(--fg3);font-size:11.5px;text-align:center;margin-top:16px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 24px);transform:translate(-50%,20px);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- additions: badges, sunset, countdown, stats, friend picks, time-of-day ---------- */
.badge{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.08em;line-height:1;padding:3px 4px;border-radius:3px;
  vertical-align:2px;margin-left:4px;background:rgba(238,238,238,.9);color:#1a2b27;text-shadow:none}
.badge.hybrid{background:rgba(233,167,92,.9)}
.act.on .badge{background:#1a2b27;color:var(--pick)}
.act.on .badge.hybrid{color:var(--pick)}
.act.h1 .badge{margin-left:5px}
.row .badge{font-size:9px;vertical-align:1px}
.sunline{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(233,167,92,.7);z-index:1;pointer-events:none}
.sunlbl{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;color:var(--pick);
  transform:translateY(-50%);line-height:1;padding:3px 0;background:#213833;z-index:1}
.strip{display:none;margin:-4px 0 10px;padding:8px 12px;border-radius:8px;background:var(--pill-dark);border:1px solid var(--pill-border);
  font-size:12.5px;font-weight:600;color:var(--fg);text-align:center;letter-spacing:.02em}
.strip b{color:var(--pick);font-variant-numeric:tabular-nums}
.strip.show{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 14px}
.stat{background:var(--pill-light);border:1px solid var(--pill-border);border-radius:8px;padding:9px 4px;text-align:center;min-width:0}
.stat b{display:block;font-size:16px;font-weight:800;text-shadow:var(--glow);font-variant-numeric:tabular-nums}
.stat span{font-size:9.5px;color:var(--fg2);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.act.friend:not(.on){outline:2px solid #8fb5ff;outline-offset:-2px}
.act.friend.on{box-shadow:0 0 0 2px #8fb5ff, 0 0 18px var(--pick-glow)}
.friendbar{display:none;margin:0 0 10px;padding:8px 12px;border-radius:8px;background:rgba(143,181,255,.18);border:1px solid rgba(143,181,255,.5);
  font-size:12.5px;color:var(--fg);align-items:center;gap:8px}
.friendbar.show{display:flex}
.friendbar span{flex:1}
.friendbar button{border:0;background:rgba(238,238,238,.9);color:#1a2b27;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:6px}
.friendbar button.ghost{background:transparent;color:var(--fg);border:1px solid var(--pill-border)}
/* time of day: the warm blur follows the sky */
body.tod-day{background:
    radial-gradient(60% 40% at 78% 18%, rgba(190,150,80,.55), transparent 70%),
    radial-gradient(45% 35% at 60% 40%, rgba(170,170,80,.5), transparent 70%),
    radial-gradient(50% 45% at 90% 65%, rgba(120,150,80,.4), transparent 70%),
    radial-gradient(40% 30% at 25% 85%, rgba(100,150,120,.4), transparent 70%),
    linear-gradient(180deg,#2a4842 0%,#233d37 45%,#1b2f2b 100%);background-attachment:fixed}
body.tod-dusk{background:
    radial-gradient(60% 40% at 78% 22%, rgba(190,80,55,.6), transparent 70%),
    radial-gradient(45% 35% at 60% 40%, rgba(200,130,60,.5), transparent 70%),
    radial-gradient(50% 45% at 90% 65%, rgba(140,80,90,.4), transparent 70%),
    radial-gradient(40% 30% at 25% 85%, rgba(80,120,110,.35), transparent 70%),
    linear-gradient(180deg,#25403a 0%,#1f3631 45%,#172a26 100%);background-attachment:fixed}
body.tod-night{background:
    radial-gradient(55% 38% at 78% 22%, rgba(120,60,70,.45), transparent 70%),
    radial-gradient(45% 35% at 60% 42%, rgba(90,80,120,.35), transparent 70%),
    radial-gradient(50% 45% at 90% 65%, rgba(60,90,100,.35), transparent 70%),
    radial-gradient(40% 30% at 25% 85%, rgba(60,100,95,.3), transparent 70%),
    linear-gradient(180deg,#1b302c 0%,#162824 45%,#0f1d1a 100%);background-attachment:fixed}
</style>

6,"name":"DELANO LEGITO B2B SHINEDOE","t":"16:30–18:30"},{"id":"sat-5-26","stage":5,"start":26,"end":34,"name":"ROD B2B ROLANDO","t":"18:30–20:30"},{"id":"sat-5-34","stage":5,"start":34,"end":38,"name":"ALTINBAS (LIVE)","t":"20:30–21:30"},{"id":"sat-5-38","stage":5,"start":38,"end":42,"name":"KANGDING RAY X LUMUS PRESENT SNELWEG (LIVE)","t":"21:30–22:30"},{"id":"sat-5-42","stage":5,"start":42,"end":50,"name":"AMORAL B2B JASMÍN","t":"22:30–00:30"}]}]};
const Q = 17;                                  // px per 15 minutes
const SUNSET = {fri:'20:20', sat:'20:18'};   // Tilburg
const KEY = 'dm26-picks', KEY_DAY = 'dm26-day', KEY_MODE = 'dm26-mode';

// ---------- persistence (localStorage, guarded) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let picks = new Set(store.get(KEY, []));
let day = store.get(KEY_DAY, null);
let view = store.get(KEY_MODE, 'grid'); if (view === true) view = 'picks'; if (!['grid','picks','map'].includes(view)) view = 'grid';
const picksMode = () => view === 'picks';
// picks shared by a friend arrive in the URL as #p=id,id,...
let friend = new Set();
(() => { const m = location.hash.match(/p=([^&]+)/); if (!m) return;
  const ids = m[1].split(',').filter(Boolean); const mine = store.get(KEY, []);
  if (ids.length && ids.join() !== mine.join()) friend = new Set(ids);
  history.replaceState(null, '', location.pathname); })();

// pick today's day automatically on festival days
const todayKey = (() => {
  const n = new Date(); const h = n.getHours();
  // until 05:00 still counts as the previous festival day
  const d = new Date(n); if (h < 5) d.setDate(d.getDate() - 1);
  const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const f = DATA.days.find(x => x.date === iso); return f ? f.key : null;
})();
if (!day || !DATA.days.some(d => d.key === day)) day = todayKey || DATA.days[0].key;

const $ = s => document.querySelector(s);
const tm = q => { const m = 12*60 + q*15; return String(Math.floor(m/60)%24).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); };
const splitName = n => { const m = n.match(/\s*\((LIVE|HYBRID)\)/i); return m ? {base: n.replace(m[0], '').replace(/\s{2,}/g, ' ').trim(), tag: m[1].toUpperCase()} : {base: n, tag: null}; };
const nameHTML = n => { const p = splitName(n); const esc = t => t.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); return esc(p.base) + (p.tag ? `<span class="badge ${p.tag.toLowerCase()}">${p.tag}</span>` : ''); };
const dayObj = () => DATA.days.find(d => d.key === day);
const byId = {}; DATA.days.forEach(d => d.acts.forEach(a => byId[a.id] = {...a, day:d.key}));

// ---------- tabs ----------
function renderTabs(){
  const t = $('#tabs'); t.innerHTML = '';
  DATA.days.forEach(d => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'tab' + (d.key === day ? ' on' : '') + (d.key === todayKey ? ' today' : '');
    const dt = new Date(d.date + 'T12:00:00');
    b.innerHTML = d.label + '<small>' + dt.getDate() + ' ' + dt.toLocaleString('en', {month:'short'}) + '</small>';
    b.onclick = () => { day = d.key; store.set(KEY_DAY, day); renderAll(); $('#grid').scrollTop = 0; };
    t.appendChild(b);
  });
  document.querySelectorAll('.view').forEach(b => b.classList.toggle('on', b.dataset.v === view));
}

// ---------- grid ----------
function renderGrid(){
  const d = dayObj(); const sheet = $('#sheet'); sheet.innerHTML = '';
  const corner = document.createElement('div'); corner.className = 'corner'; sheet.appendChild(corner);
  DATA.stages.forEach((s, i) => {
    const h = document.createElement('div'); h.className = 'stage'; h.style.setProperty('--sc', `var(--s${i})`);
    h.innerHTML = '<i></i>' + s; sheet.appendChild(h);
  });
  const times = document.createElement('div'); times.className = 'times';
  for (let q = 0; q <= 51; q += 2){                 // every 30 min
    const lab = document.createElement('div'); lab.className = 't'; lab.style.top = (q*Q) + 'px';
    lab.textContent = tm(q); lab.dataset.q = q; if (q % 4) { lab.style.background = 'transparent'; lab.style.color = 'var(--fg2)'; lab.style.fontWeight = '500'; } if (q === 0) lab.style.transform = 'translateY(2px)'; times.appendChild(lab);
  }
  sheet.appendChild(times);
  DATA.stages.forEach((s, i) => {
    const col = document.createElement('div'); col.className = 'col'; col.style.setProperty('--sc', `var(--s${i})`);
    d.acts.filter(a => a.stage === i).forEach(a => {
      const el = document.createElement('div'); const dur = a.end - a.start;
      el.className = 'act' + (picks.has(a.id) ? ' on' : '') + (dur <= 2 ? ' h1' : dur <= 3 ? ' h2' : dur <= 4 ? ' h3' : '');
      if (dur > 4) el.style.setProperty('--lines', Math.max(3, Math.floor((dur*Q - 4 - 12 - 15) / 15)));
      el.style.top = (a.start*Q + 2) + 'px'; el.style.height = (dur*Q - 4) + 'px';
      el.innerHTML = '<div class="n">' + nameHTML(a.name) + '</div><div class="tm">' + tm(a.start) + ' – ' + tm(a.end) + '</div>';
      if (friend.has(a.id)) el.classList.add('friend');
      el.dataset.id = a.id;
      el.addEventListener('click', () => toggle(a.id, el));
      col.appendChild(el);
    });
    sheet.appendChild(col);
  });
  const now = document.createElement('div'); now.className = 'nowline'; now.id = 'now';
  sheet.appendChild(now);
  const ss = SUNSET[d.key]; if (ss) {
    const [sh, sm] = ss.split(':').map(Number); const sq = ((sh*60 + sm) - 12*60) / 15;
    const sl = document.createElement('div'); sl.className = 'sunline'; sl.style.top = (44 + sq*Q) + 'px'; sheet.appendChild(sl);
    const sb = document.createElement('div'); sb.className = 'sunlbl'; sb.style.top = (sq*Q) + 'px'; sb.textContent = '☀ ' + ss; sb.title = 'sunset'; times.appendChild(sb);
    times.querySelectorAll('.t').forEach(l => { if (Math.abs(+l.dataset.q - sq) < 1.3) l.dataset.sun = '1'; });
  }
  const nl = document.createElement('div'); nl.className = 'nowlbl'; nl.id = 'nowlbl'; times.appendChild(nl);
  tickNow();
}

function toggle(id, el){
  if (picks.has(id)) picks.delete(id); else picks.add(id);
  store.set(KEY, [...picks]);
  if (el) el.classList.toggle('on', picks.has(id));
  if (navigator.vibrate) navigator.vibrate(8);
  renderCount(); tickStrip(); if (picksMode()) renderList(); if (view === 'map') renderMap();
}

function renderCount(){
  const d = dayObj(); const n = d.acts.filter(a => picks.has(a.id)).length; const all = picks.size;
  $('#count').innerHTML = `<b>${n}</b> picked ${d.label.slice(0,3)}${all !== n ? ` · ${all} total` : ''}`;
  $('#vc').textContent = n ? n : '';
}

// ---------- now line ----------
function tickNow(){
  const el = $('#now'); if (!el) return;
  const d = dayObj(); const n = new Date();
  const start = new Date(d.date + 'T12:00:00'); const mins = (n - start) / 60000;
  document.querySelectorAll('.times .t').forEach(l => { l.style.visibility = l.dataset.sun ? 'hidden' : ''; });
  if (mins < -30 || mins > 51*15) { el.style.display = 'none'; const nl = $('#nowlbl'); if (nl) nl.style.display = 'none'; return; }
  el.style.display = 'block'; el.style.top = (44 + Math.max(0, mins)/15*Q) + 'px';
  const nl = $('#nowlbl'); nl.style.display = 'block'; nl.style.top = (Math.max(0, mins)/15*Q) + 'px';
  const nq = Math.max(0, mins)/15; document.querySelectorAll('.times .t').forEach(l => { l.style.visibility = (Math.abs(+l.dataset.q - nq) < 1.1 || l.dataset.sun) ? 'hidden' : ''; });
  nl.textContent = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}
function tickStrip(){
  const n = new Date(); const el = $('#strip');
  const first = new Date(DATA.days[0].date + 'T12:00:00'); const last = DATA.days[DATA.days.length-1];
  const end = new Date(last.date + 'T12:00:00'); end.setMinutes(end.getMinutes() + 51*15);
  const fmt = ms => { const m = Math.round(ms/60000); const d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
    return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${String(mm).padStart(2,'0')}m` : `${mm} min`; };
  let txt = '';
  if (n < first) txt = `Draaimolen starts in <b>${fmt(first - n)}</b>`;
  else {
    const next = DATA.days.map(d => new Date(d.date + 'T12:00:00')).find(t => t > n);
    const cur = DATA.days.find(d => { const a = new Date(d.date + 'T12:00:00'); const b = new Date(a); b.setMinutes(b.getMinutes() + 51*15); return n >= a && n <= b; });
    if (!cur && next && (next - n) < 12*3600000) txt = `Day 2 starts in <b>${fmt(next - n)}</b>`;
  }
  // Now & next, based on picks, while the selected day is live
  const d = dayObj(); const ds = new Date(d.date + 'T12:00:00'); const nowq = (n - ds) / 900000;
  el.classList.remove('nownext');
  if (nowq >= -0.5 && nowq <= 51) {
    const mine = d.acts.filter(a => picks.has(a.id)).sort((a,b) => a.start - b.start);
    const on = mine.filter(a => a.start <= nowq && nowq < a.end);
    const next = mine.find(a => a.start > nowq);
    const one = a => `<em>${DATA.stages[a.stage]}</em> <b>${splitName(a.name).base}</b>`;
    const parts = [];
    on.slice(0, 2).forEach((a, i) => parts.push(`<span class="nn"><i>${i ? 'Also' : 'Now'}</i> ${one(a)}</span>`));
    if (on.length > 2) parts.push(`<span class="nn"><i>+${on.length - 2} more</i></span>`);
    if (next) { const mins = Math.round((next.start - nowq) * 15); parts.push(`<span class="nn"><i>Next</i> ${one(next)} <i>${mins <= 0 ? 'now' : mins < 60 ? `in ${mins} min` : `at ${tm(next.start)}`}</i></span>`); }
    if (!mine.length) parts.push(`<span class="nn"><i>No picks yet</i> tap acts in the timetable to build your night</span>`);
    else if (!on.length && !next) parts.push(`<span class="nn"><i>Done</i> that was your last pick — enjoy the rest of the night</span>`);
    txt = parts.join(''); el.classList.add('nownext');
  }
  el.innerHTML = txt; el.classList.toggle('show', !!txt && !picksMode());
  if (view === 'map' && !scrubbing) renderMap();
  // time of day backdrop (real clock, any day)
  const h = n.getHours() + n.getMinutes()/60;
  document.body.classList.remove('tod-day','tod-dusk','tod-night');
  document.body.classList.add(h >= 7 && h < 18.5 ? 'tod-day' : h >= 18.5 && h < 21 ? 'tod-dusk' : 'tod-night');
}
setInterval(tickNow, 30000); setInterval(tickStrip, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tickNow(); tickStrip(); } });

// ---------- map ----------
// stage positions as fractions of the official 2026 map (1080x1350); label side per stage
const MAP_IMG = 'https://cdn.sanity.io/images/ow8hsen7/production/93f2b2ebc605e4849617efccdc46553082013734-1080x1350.png?w=1080&fit=max&auto=format&q=80';
// x/y = marker; lx/ly = label anchor, tf = label transform (keeps labels clear of each other and of the map's own text)
const MAP_POS = [
  {x:.500, y:.667, lx:.500, ly:.640, tf:'translate(-50%,-100%)'},  // 1 Strobe   – label above
  {x:.208, y:.718, lx:.208, ly:.745, tf:'translateX(-50%)'},       // 2 Moon     – below
  {x:.064, y:.611, lx:.040, ly:.640, tf:'none'},                   // 3 Aura     – below, hanging right
  {x:.153, y:.329, lx:.120, ly:.302, tf:'translateY(-100%)'},      // 4 Forest Rave – above, hanging right
  {x:.347, y:.456, lx:.347, ly:.429, tf:'translate(-50%,-100%)'},  // 5 The Pit  – above
  {x:.631, y:.462, lx:.600, ly:.489, tf:'translateX(-50%)'},       // 6 Tunnel   – below
];
let scrubbing = false, scrubQ = 0;
function liveQ(){ const d = dayObj(); return (new Date() - new Date(d.date + 'T12:00:00')) / 900000; }
function renderMap(){
  const d = dayObj(); const box = $('#map');
  const lq = liveQ(); const isLive = lq >= 0 && lq <= 51;
  const q = scrubbing ? scrubQ : (isLive ? lq : 0);
  const at = si => d.acts.filter(a => a.stage === si).find(a => a.start <= q && q < a.end);
  const after = si => d.acts.filter(a => a.stage === si && a.start > q).sort((a,b) => a.start - b.start)[0];
  if (!box.dataset.built) {
    box.innerHTML = `<div class="mapwrap" id="mapwrap"><img src="map.png" alt="Festival map" onerror="this.onerror=null;this.src='${MAP_IMG}'"></div>
      <div class="scrub"><b id="scrubT"></b><input type="range" id="scrub" min="0" max="50" step="1"><button id="scrubNow" type="button">Now</button></div>
      <div class="scrubhint" id="scrubhint"></div><div id="mrows"></div>`;
    box.dataset.built = '1';
    const inp = $('#scrub');
    inp.oninput = () => { scrubbing = true; scrubQ = +inp.value; renderMap(); };
    $('#scrubNow').onclick = () => { scrubbing = false; renderMap(); };
  }
  const wrap = $('#mapwrap'); wrap.querySelectorAll('.mk,.lb').forEach(e => e.remove());
  $('#scrub').value = Math.min(50, Math.max(0, Math.floor(q)));
  $('#scrubT').textContent = tm(Math.floor(Math.max(0, Math.min(50, q))));
  const nb = $('#scrubNow'); nb.classList.toggle('live', isLive && !scrubbing); nb.style.display = isLive ? '' : 'none';
  $('#scrubhint').textContent = isLive && !scrubbing ? 'Live — who is playing where right now. Drag to look ahead.' : `Showing ${d.label} at ${tm(Math.floor(q))} — drag the slider to move through the day.`;
  const rows = $('#mrows'); rows.innerHTML = '';
  DATA.stages.forEach((st, si) => {
    const cur = at(si), nxt = after(si); const p = MAP_POS[si];
    const isPick = cur && picks.has(cur.id);
    const mk = document.createElement('div'); mk.className = 'mk' + (isPick ? ' pick' : '') + (isLive && !scrubbing && isPick ? ' live' : '');
    mk.style.left = (p.x*100) + '%'; mk.style.top = (p.y*100) + '%'; mk.textContent = si + 1; wrap.appendChild(mk);
    const lb = document.createElement('div'); lb.className = 'lb' + (isPick ? ' pick' : '') + (cur ? '' : ' dim');
    lb.innerHTML = `<span class="st">${st}</span><span class="ar">${cur ? splitName(cur.name).base : (nxt ? `<small>${tm(nxt.start)}</small> ${splitName(nxt.name).base}` : '<small>closed</small>')}</span>`;
    lb.style.left = (p.lx*100) + '%'; lb.style.top = (p.ly*100) + '%'; lb.style.transform = p.tf;
    wrap.appendChild(lb);
    const r = document.createElement('div'); r.className = 'mrow' + (isPick ? ' pick' : '');
    r.innerHTML = `<div class="num">${si + 1}</div><div class="body"><div class="st">${st}</div>
      <div class="ar">${cur ? nameHTML(cur.name) : '<span style="color:var(--fg2)">—</span>'}</div>
      <div class="nx">${cur ? `<b>${tm(cur.start)}–${tm(cur.end)}</b>` : ''}${cur && nxt ? ' · ' : ''}${nxt ? `Next <b>${tm(nxt.start)}</b> ${splitName(nxt.name).base}${picks.has(nxt.id) ? ' ★' : ''}` : (cur ? ' · last act here' : 'Closed')}</div></div>`;
    rows.appendChild(r);
  });
}

// ---------- picks list ----------
function renderList(){
  const d = dayObj(); const box = $('#list'); box.innerHTML = '';
  const mine = d.acts.filter(a => picks.has(a.id)).sort((a,b) => a.start - b.start || a.stage - b.stage);
  if (!mine.length){
    box.innerHTML = `<div class="empty">Nothing picked for <b>${d.label}</b> yet.<br>Switch to the grid and tap the acts you want to see.</div>`;
    return;
  }
  const hours = mine.reduce((t, a) => t + (a.end - a.start), 0) / 4;
  const clashes = mine.filter(a => mine.some(b => b !== a && b.start < a.end && a.start < b.end)).length;
  const live = mine.filter(a => splitName(a.name).tag).length;
  const st = document.createElement('div'); st.className = 'stats';
  st.innerHTML = `<div class="stat"><b>${mine.length}</b><span>sets</span></div><div class="stat"><b>${Math.floor(hours)}h${hours % 1 ? String(Math.round((hours % 1) * 60)).padStart(2,'0') : ''}</b><span>of music</span></div>` +
    `<div class="stat"><b>${live}</b><span>live/hybrid</span></div><div class="stat"><b>${clashes}</b><span>clashing</span></div>`;
  box.appendChild(st);
  mine.forEach((a, i) => {
    const clash = mine.some(b => b !== a && b.start < a.end && a.start < b.end);
    const r = document.createElement('div'); r.className = 'row'; r.style.setProperty('--sc', `var(--s${a.stage})`);
    r.innerHTML = `<div class="when">${tm(a.start)}<small>${tm(a.end)}</small></div>
      <div class="what"><div class="n"></div><div class="s"><i></i>${DATA.stages[a.stage]}${clash ? '<span class="clash">clash</span>' : ''}</div></div>
      <button class="x" type="button" aria-label="Remove">×</button>`;
    r.querySelector('.n').innerHTML = nameHTML(a.name);
    r.querySelector('.x').onclick = () => { toggle(a.id); renderGridState(); renderList(); };
    box.appendChild(r);
  });
  const act = document.createElement('div'); act.className = 'actions';
  act.innerHTML = `<button class="btn" id="share" type="button">Share ${d.label}</button><button class="btn warn" id="clear" type="button">Clear ${d.label}</button>`;
  box.appendChild(act);
  $('#share').onclick = () => {
    const txt = `Draaimolen ${d.label} – my picks\n` + mine.map(a => `${tm(a.start)}–${tm(a.end)}  ${a.name}  @ ${DATA.stages[a.stage]}`).join('\n');
    const url = location.origin + location.pathname + '#p=' + [...picks].join(',');
    if (navigator.share) navigator.share({text: txt + '\n\nSee them on the timetable:', url}).catch(()=>{});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt + '\n' + url).then(() => toast('Copied to clipboard'));
  };
  $('#clear').onclick = () => {
    if (!confirm(`Remove all ${mine.length} picks for ${d.label}?`)) return;
    mine.forEach(a => picks.delete(a.id)); store.set(KEY, [...picks]); renderAll();
  };
  const h = document.createElement('div'); h.className = 'hint';
  h.textContent = 'Picks are saved on this phone only. Open the app from the same icon each time to keep them.';
  box.appendChild(h);
}
function renderGridState(){ document.querySelectorAll('.act').forEach(el => el.classList.toggle('on', picks.has(el.dataset.id))); }

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1800); }

document.querySelectorAll('.view').forEach(b => b.onclick = () => { view = b.dataset.v; store.set(KEY_MODE, view); scrubbing = false; setViewClass(); renderTabs(); renderFriend(); tickStrip(); if (picksMode()) renderList(); if (view === 'map') renderMap(); });
function setViewClass(){ document.body.classList.toggle('picks', view === 'picks'); document.body.classList.toggle('map', view === 'map'); }

function renderFriend(){
  const fb = $('#friendbar'); const valid = [...friend].filter(id => byId[id]);
  fb.classList.toggle('show', valid.length > 0 && !picksMode());
  if (valid.length) $('#friendtxt').textContent = `A friend shared ${valid.length} picks — outlined in blue.`;
}
$('#friendadd').onclick = () => { friend.forEach(id => { if (byId[id]) picks.add(id); }); store.set(KEY, [...picks]); friend = new Set(); renderAll(); toast('Added to your picks'); };
$('#frienddismiss').onclick = () => { friend = new Set(); renderAll(); };
function renderAll(){ setViewClass(); renderTabs(); renderGrid(); renderCount(); renderFriend(); tickStrip(); if (picksMode()) renderList(); if (view === 'map') renderMap(); }
renderAll();

// offline: cache the app on the phone so it works without signal in the forest
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

// scroll the grid to "now" on festival days, otherwise to the top
(() => { const el = $('#now'); if (el && el.style.display === 'block') $('#grid').scrollTop = Math.max(0, parseFloat(el.style.top) - 160); })();
</script>
</body>
</html>
